[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-proof-lab"
version = "0.1.0"
description = "Proof-aware portfolio optimization prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "cvxpy==1.5.3",
  "nautilus_trader==1.214.0",
  "pytest==8.3.3",
  "hypothesis==6.112.2"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
